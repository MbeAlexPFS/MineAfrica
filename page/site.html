<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineAfrica</title>
    <link rel="stylesheet" href="../../style/bootstrap.min.css">
    <script src="../../script/bootstrap.bundle.min.js"></script>
    <style>

    .head {
            background:
            /* top, transparent black, faked with gradient */ 
            linear-gradient(
              rgba(0, 0, 0, 0.7), 
              rgba(0, 0, 0, 0.7)
            ),
            /* bottom, image */
            url("https://th.bing.com/th/id/R.47c1d0cd5cdb0ee20d78cd3436885146?rik=iZmOoRs0d7Czdw&pid=ImgRaw&r=0");

            background-repeat: no-repeat;
            background-size: 100% ;
        }
        
        .tjustify {
          margin: 0;
          text-indent: 2rem;
          text-align: justify;
        }

        body {
            background:
            /* top, transparent black, faked with gradient */ 
            linear-gradient(
              rgba(0, 0, 0, 0.7), 
              rgba(0, 0, 0, 0.7)
            ),
            /* bottom, image */
            url("https://www.strong-nkv.cd/wp-content/uploads/2018/01/mining-industry-bg.jpg");

            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

    </style>
</head>
<body >
    <nav class="navbar navbar-light bg-light fixed-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Mine</span><span class="text-warning">Africa</span></a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div
                class="offcanvas offcanvas-end"
                tabindex="-1"
                id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel"
            >
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
                        Menu
                    </h5>
                    <button
                        type="button"
                        class="btn-close text-reset"
                        data-bs-dismiss="offcanvas"
                        aria-label="Close"
                    ></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                aria-current="page"
                                href="/"
                                >Retourner sur la carte</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#rdesc">pays description</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#stdesc">les ressources minières</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#stat">Les statistiques</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container-sm card p-5 " id="body">
        <div class="row mt-3 text-light text-center p-5 head" >
            <h1><span class="country"></span></h1>     
        </div>

        <div class="row mt-3" >
            <div class="col-md-4">
                <a href="https://th.bing.com/th/id/OIP.T1xFi7JJx8W6aWLNzPARnAHaEK?rs=1&pid=ImgDetMain">
                    <img class="img-fluid" src="https://th.bing.com/th/id/OIP.T1xFi7JJx8W6aWLNzPARnAHaEK?rs=1&pid=ImgDetMain">
                </a>
            </div>
            <div class="col-md" id="rdesc">

            </div>      
        </div>

        <h1 class="p-3 mt-2">Les ressources minières </h1>

        <!-- liste ressources -->
        <div class="container" >
            <div
                class="table-responsive"
            >
                <table
                    class="table table-primary"
                >
                    <thead>
                        <tr>
                            <th scope="col">Produits Minier</th>
                            <th scope="col">Densité</th>
                            <th scope="col">Prix</th>
                        </tr>
                    </thead>
                    <tbody id="stdesc">
                    
                    </tbody>
                </table>
            </div>
        </div>

        <h1 class="p-3 mt-2">Les statistiques</h1>

        <!-- stat -->
        <div class="container" >
            <div
                class="row justify-content-center align-items-center g-2"
                id="stat" >
            </div>
        </div>
    
    </div>
    <div class="footer bg-dark text-white p-2 text-center">
        <h5>Tous droits reservé MineAfrica 2025-2026</h5>
    </div>
    <script src="site.js"></script>
</body>
</html>
